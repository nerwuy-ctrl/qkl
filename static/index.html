<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>供应链金融平台</title>
  <style>
    :root{--ink:#15251f;--muted:#687b73;--brand:#176b4d;--brand2:#2a946c;--paper:#f4f7f3;--line:#dce6df;--warn:#d48632}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 system-ui,"Microsoft YaHei",sans-serif}
    header{height:70px;background:#102d24;color:white;display:flex;align-items:center;padding:0 34px;gap:18px;box-shadow:0 8px 30px #143b2c26}
    .logo{width:38px;height:38px;border:1px solid #7dd3ac;border-radius:12px;display:grid;place-items:center;font-size:20px;background:#1b5b44}.title{font-size:19px;font-weight:700}.sub{color:#9bc3b2;font-size:12px}
    .identity{margin-left:auto;display:flex;gap:9px}.identity select,.identity input{border:1px solid #396b5a;background:#183d31;color:white;border-radius:8px;padding:8px 10px}
    main{max-width:1440px;margin:auto;padding:28px 34px}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.hero h1{font-size:26px;margin:0}.hero p{margin:5px 0 0;color:var(--muted)}
    .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric,.panel{background:white;border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 18px #214a3920}.metric{padding:19px}.metric b{display:block;font-size:25px;margin-top:4px}.metric span{color:var(--muted)}
    nav{display:flex;gap:7px;margin:22px 0 14px}button{border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600}nav button{background:#e3ebe6;color:#496158}nav button.active,.primary{background:var(--brand);color:white}.secondary{background:#e3eee8;color:var(--brand)}.danger{background:#fff0e3;color:#a85818}
    .panel{padding:20px}.view{display:none}.view.active{display:block}.split{display:grid;grid-template-columns:1.45fr .8fr;gap:15px}h2{font-size:17px;margin:0 0 15px}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #edf1ee;padding:11px 9px;text-align:left;white-space:nowrap}th{color:var(--muted);font-size:12px}td.money{font-weight:700}.tag{padding:3px 8px;border-radius:20px;background:#eaf5ef;color:var(--brand);font-size:12px}.tag.PENDING,.tag.APPLIED{background:#fff4df;color:#a46a15}.tag.REJECTED{background:#ffe8e3;color:#a43c2a}
    form{display:grid;gap:11px}label{color:var(--muted);font-size:12px}input,select{width:100%;border:1px solid #ccd9d1;border-radius:8px;padding:10px;background:white;color:var(--ink)}.actions{display:flex;gap:6px}.hash{max-width:150px;overflow:hidden;text-overflow:ellipsis;font-family:monospace;color:var(--muted)}
    .timeline{border-left:2px solid #cfe0d7;margin-left:8px;padding-left:20px}.event{position:relative;margin-bottom:18px}.event:before{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--brand2);left:-26px;top:5px}.event b{display:block}.event small{color:var(--muted)}
    #toast{position:fixed;right:25px;bottom:25px;background:#173c30;color:white;padding:12px 18px;border-radius:10px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}#toast.show{opacity:1;transform:none}
    @media(max-width:900px){.metrics{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}header{padding:0 15px}.identity input{display:none}main{padding:20px 15px}.table-wrap{overflow:auto}}
  </style>
</head>
<body>
<header><div class="logo">链</div><div><div class="title">供应链金融平台</div><div class="sub">可信供应链金融协同平台</div></div><div class="identity"><select id="role"><option>供应商</option><option>核心企业</option><option>金融机构</option><option>监管机构</option><option>管理员</option></select><input id="actor" value="华星电子" title="当前机构"></div></header>
<main>
  <div class="hero"><div><h1>业务总览</h1><p>链上凭证与链下业务协同，让每一笔融资都有迹可循。</p></div><span id="clock"></span></div>
  <section class="metrics"><div class="metric"><span>应收账款</span><b id="mCount">0</b></div><div class="metric"><span>账款总额</span><b id="mAmount">¥0</b></div><div class="metric"><span>融资金额</span><b id="mLoan">¥0</b></div><div class="metric"><span>链上事件</span><b id="mChain">0</b></div></section>
  <nav><button class="active" data-view="receivables">账款与确权</button><button data-view="loans">融资审批</button><button data-view="audit">链上审计</button></nav>

  <section id="receivables" class="view active split">
    <div class="panel"><h2>应收账款台账</h2><div class="table-wrap"><table><thead><tr><th>业务编号</th><th>供应商 / 核心企业</th><th>金额</th><th>到期日</th><th>状态</th><th>操作</th></tr></thead><tbody id="receivableRows"></tbody></table></div></div>
    <div class="panel"><h2>登记新账款</h2><form id="receivableForm"><div><label>供应商</label><input name="supplier" value="华星电子" required></div><div><label>核心企业</label><input name="core_enterprise" value="远航科技" required></div><div><label>账款金额（元）</label><input name="amount" type="number" value="300000" min="1" required></div><div><label>到期日</label><input name="due_date" type="date" required></div><div><label>合同编号</label><input name="contract_no" value="HT-2026-0621" required></div><button class="primary">登记并存证</button></form></div>
  </section>

  <section id="loans" class="view split">
    <div class="panel"><h2>融资申请列表</h2><div class="table-wrap"><table><thead><tr><th>申请编号</th><th>账款编号</th><th>融资金额</th><th>风险评分</th><th>状态</th><th>审批</th></tr></thead><tbody id="loanRows"></tbody></table></div></div>
    <div class="panel"><h2>发起融资申请</h2><form id="loanForm"><div><label>已确权账款</label><select name="asset_id" id="assetSelect"></select></div><div><label>融资金额（元）</label><input name="loan_amount" type="number" value="200000" min="1" required></div><button class="primary">评分并提交申请</button></form><p style="color:var(--muted);margin-top:18px">系统按账龄、融资比例和确权状态形成实时风险评分，审批结果与关键证据同步写入模拟联盟链账本。</p></div>
  </section>

  <section id="audit" class="view split">
    <div class="panel"><h2>业务穿透式审计</h2><form id="auditForm" style="display:flex;flex-direction:row"><select id="auditAsset"></select><button class="primary">查询轨迹</button></form><div id="auditSummary" style="margin-top:20px"></div></div>
    <div class="panel"><h2>链上事件时间轴</h2><div class="timeline" id="timeline"></div></div>
  </section>
</main><div id="toast"></div>
<script>
const $=s=>document.querySelector(s), fmt=n=>'¥'+Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:2});
const names={PENDING:'待确权',CONFIRMED:'已确权',REJECTED:'已驳回',APPLIED:'待审批',APPROVED:'已放款'};
let state={receivables:[],loans:[]};
function headers(){return {'Content-Type':'application/json','X-Role':encodeURIComponent($('#role').value),'X-Actor':encodeURIComponent($('#actor').value)}}
async function api(url,opt={}){let r=await fetch(url,{...opt,headers:{...headers(),...(opt.headers||{})}});let data=await r.json();if(!r.ok)throw Error(data.detail||'请求失败');return data}
function toast(msg,bad=false){let x=$('#toast');x.textContent=msg;x.style.background=bad?'#9b3e2e':'#173c30';x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2600)}
function fd(form){let o=Object.fromEntries(new FormData(form));for(let k in o)if(['amount','loan_amount'].includes(k))o[k]=Number(o[k]);return o}
function tag(s){return `<span class="tag ${s}">${names[s]||s}</span>`}
async function load(){state=await api('/api/dashboard');let m=state.metrics;$('#mCount').textContent=m.receivable_count;$('#mAmount').textContent=fmt(m.receivable_amount);$('#mLoan').textContent=fmt(m.loan_amount);$('#mChain').textContent=m.chain_events;
 $('#receivableRows').innerHTML=state.receivables.map(x=>`<tr><td><b>${x.asset_id}</b><div class="hash" title="${x.file_hash}">${x.file_hash}</div></td><td>${x.supplier}<br><small>${x.core_enterprise}</small></td><td class="money">${fmt(x.amount)}</td><td>${x.due_date}</td><td>${tag(x.status)}</td><td class="actions">${x.status==='PENDING'?`<button class="secondary" onclick="confirmAsset('${x.asset_id}','CONFIRMED')">确权</button><button class="danger" onclick="confirmAsset('${x.asset_id}','REJECTED')">驳回</button>`:'—'}</td></tr>`).join('');
 $('#loanRows').innerHTML=state.loans.map(x=>`<tr><td><b>${x.loan_id}</b></td><td>${x.asset_id}</td><td class="money">${fmt(x.loan_amount)}</td><td><b>${x.risk_score}</b> · ${x.risk_level}</td><td>${tag(x.status)}</td><td class="actions">${x.status==='APPLIED'?`<button class="secondary" onclick="approve('${x.loan_id}','APPROVED')">通过</button><button class="danger" onclick="approve('${x.loan_id}','REJECTED')">拒绝</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="6">暂无融资申请</td></tr>';
 let options=state.receivables.filter(x=>x.status==='CONFIRMED').map(x=>`<option value="${x.asset_id}">${x.asset_id} · ${x.supplier} · ${fmt(x.amount)}</option>`).join('');$('#assetSelect').innerHTML=options;$('#auditAsset').innerHTML=state.receivables.map(x=>`<option>${x.asset_id}</option>`).join('');
}
async function confirmAsset(id,result){try{await api(`/api/receivables/${id}/confirm`,{method:'POST',body:JSON.stringify({result})});toast('确权状态已更新并写入链上');load()}catch(e){toast(e.message,true)}}
async function approve(id,result){let interest_rate=result==='APPROVED'?Number(prompt('请输入年化融资利率（%）','4.6')):null;if(result==='APPROVED'&&!Number.isFinite(interest_rate))return;try{await api(`/api/loans/${id}/approve`,{method:'POST',body:JSON.stringify({result,interest_rate})});toast('审批结果已存证');load()}catch(e){toast(e.message,true)}}
$('#receivableForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/receivables',{method:'POST',body:JSON.stringify(fd(e.target))});toast('账款登记成功');load()}catch(x){toast(x.message,true)}};
$('#loanForm').onsubmit=async e=>{e.preventDefault();try{let x=await api('/api/loans/apply',{method:'POST',body:JSON.stringify(fd(e.target))});toast(`申请成功：风险评分 ${x.risk_score}（${x.risk_level}）`);load()}catch(x){toast(x.message,true)}};
$('#auditForm').onsubmit=async e=>{e.preventDefault();try{let x=await api('/api/audit/'+$('#auditAsset').value);$('#auditSummary').innerHTML=`<div class="metric"><span>凭证完整性</span><b style="color:var(--brand)">${x.chain_valid?'校验通过':'校验异常'}</b><small>${x.asset.supplier} → ${x.asset.core_enterprise}<br>${fmt(x.asset.amount)} · ${names[x.asset.status]}</small></div>`;$('#timeline').innerHTML=x.events.map(e=>`<div class="event"><b>${e.event_type}</b><small>区块 #${e.block_height} · ${e.actor}（${e.role}）<br>${new Date(e.created_at).toLocaleString()}<br><span class="hash" title="${e.tx_hash}">${e.tx_hash}</span></small></div>`).join('')}catch(x){toast(x.message,true)}};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.view).classList.add('active')});
$('#role').onchange=()=>{let map={'供应商':'华星电子','核心企业':'远航科技','金融机构':'海川银行','监管机构':'金融监管局','管理员':'平台管理员'};$('#actor').value=map[$('#role').value]};
let due=new Date();due.setMonth(due.getMonth()+6);document.querySelector('[name=due_date]').value=due.toISOString().slice(0,10);$('#clock').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'});load();
</script></body></html>
